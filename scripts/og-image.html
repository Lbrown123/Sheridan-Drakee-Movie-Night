<!DOCTYPE html>
<!--
  Source for the social share image (og-image.jpg, 1200x630).

  It reuses the live site's header styles (../style.css) and decorations
  (../holiday.js), so it stays in step with the site design. Whenever the
  header/theme changes, re-render the image — see "Social share image" in
  CLAUDE.md for the one-line command.

  The header markup below is a copy of the <header> in index.html; keep the
  two in sync.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Social share image</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mr+Dafoe&family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <style>
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .holiday-header {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-bottom: 0;
    }

    .header-inner {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 0 56px;
    }

    /* bigger bulbs so they read at thumbnail size */
    .lights { zoom: 1.45; }

    .holiday-header .title-family { font-size: 2.2rem; }
    .holiday-header .title-main   { font-size: 11.5rem; }

    .holly-rule { margin-top: 30px; }
    .holly-rule svg { width: 104px; height: 46px; }
    .holly-rule::before,
    .holly-rule::after { width: 150px; }

    .tagline {
      font-size: 1.7rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <canvas id="snow" class="snow" aria-hidden="true"></canvas>
  <header class="holiday-header">
    <div class="lights" id="lights" aria-hidden="true"></div>
    <div class="header-inner">
      <h1 class="title">
        <span class="title-family">Sheridan-Drake</span>
        <span class="title-main">Movie Night</span>
      </h1>
      <div class="holly-rule" aria-hidden="true">
        <svg viewBox="0 0 64 28" width="64" height="28"><path d="M32 16c-6-1-10-6-18-5 3 2 1 5 4 6-3 1-2 4-6 5 8 2 13-2 20-6zM32 16c6-1 10-6 18-5-3 2-1 5-4 6 3 1 2 4 6 5-8 2-13-2-20-6z" fill="#2f7a4b"/><circle cx="29" cy="15" r="3.4" fill="#d43a3a"/><circle cx="35" cy="15" r="3.4" fill="#d43a3a"/><circle cx="32" cy="10.5" r="3.4" fill="#e04848"/></svg>
      </div>
      <p class="tagline">Logan, Elizabeth, and Abby's Ratings</p>
    </div>
  </header>
  <script src="../holiday.js"></script>
</body>
</html>
